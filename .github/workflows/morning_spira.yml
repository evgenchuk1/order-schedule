name: 📋 Spira counting reminders

on:
  # Schedule disabled 2026-10-23 — Spira reminders no longer wanted
  # (local SpiraScheduleNotify5Min task disabled too). Manual run only.
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cloud spira notifier
        run: python3 .github/scripts/notify_spira_cloud.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
